<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/Logo latinos .png">
<link rel="stylesheet" href="css/style.css">
<title>Latinos en Pelota</title>
<link rel="stylesheet" href="css/extras.css">
</head>
<body>

<header class="site">
  <div class="brand">
    <div class="logo"><img src="assets/Logo latinos .png" alt="Latinos en Pelota"></div>
    <div>
      <h1>Latinos en Pelota</h1>
      <p>El deporte latino, a otro nivel</p>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
   <div class="date" id="fecha-hoy">Cargando fecha...</div>
   <a href="Panel-de-admin.html" id="btnPanelAdmin" style="display: none; font-size:13px;color:var(--yellow);padding:6px 12px;border:1px solid rgba(242,193,78,0.4);border-radius:4px;font-weight:600;">Panel Admin</a>
  </div>
</header>

<nav class="tabs" id="contenedor-tabs">
  <a href="#" class="active">Todas</a>

  <div class="nav-controls">
    <select id="filtro-fecha" class="date-select" aria-label="Filtrar por fecha">
      <option value="todas">Todas las fechas</option>
      <option value="reciente">Reciente (últimos 7 días)</option>
      <option value="este_mes">Este mes</option>
      <option value="mes_pasado">Mes pasado</option>
      <option value="hace_2_meses">Hace 2 meses</option>
      <option value="mas_2_meses">Hace mucho tiempo</option>
    </select>

    <form class="search-box" role="search" onsubmit="return false;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" placeholder="Buscar noticias..." aria-label="Buscar noticias">
    </form>
  </div>
</nav>

<main>

  <article class="hero" id="hero">
    <div class="body">
      <p>Cargando la noticia destacada...</p>
    </div>
  </article>

  <aside class="sidebar" id="sidebar-anuncios">
  </aside>

  <div class="grid"></div>

</main>

<footer>
  © 2026 Portal deportivo · Todos los derechos reservados<br>
  <a href="Panel-de-admin.html" id="enlaceCuenta">Iniciar sesión</a> · <a href="politica-de-privacidad.html">Política de privacidad</a> · <a href="politica-de-privacidad.html#cookies">Cookies</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/consentimiento.js"></script>
<script src="js/buscador.js"></script>
</body>
</html>
